name: kama-sync
on:
  schedule:
    - cron: "__CRON__"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kama-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install
        run: npm i --no-save --no-audit --no-fund israeli-bank-scrapers@6.13.0 libsodium-wrappers@0.7.15 > /dev/null 2>&1
      - name: sync
        env:
__ENVS__
        run: node kama/run.mjs
      - name: save
        run: |
          git config user.name kama-bot
          git config user.email kama-bot@users.noreply.github.com
          git add data status.json
          git commit -m "sync" -q || true
          git push -q
