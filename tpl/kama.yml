name: kama-sync
on:
  schedule:
    - cron: "__CRON__"
  workflow_dispatch:
    inputs:
      interactive:
        description: "ריצה מהדף (אפשר לבקש קוד SMS)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: kama-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install
        run: cp kama/package.json kama/package-lock.json . && npm ci --no-audit --no-fund > /dev/null 2>&1
      - name: git identity
        run: |
          git config user.name kama-bot
          git config user.email kama-bot@users.noreply.github.com
      - name: sync
        env:
          KAMA_INTERACTIVE: ${{ inputs.interactive }}
          KAMA_STATE_KEY: ${{ secrets.KAMA_STATE_KEY }}
__ENVS__
        run: node kama/run.mjs > /dev/null 2>&1
